<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Message Board</title>
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2c3e50;
            --bg-color: #f9f9f9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            border-radius: 8px 8px 0 0;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        h1 {
            margin: 0;
            font-size: 24px;
        }
        
        .message-form {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: vertical;
            font-family: inherit;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #2980b9;
        }
        
        .message-board {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .message {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
        }
        
        .message:last-child {
            border-bottom: none;
        }
        
        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 14px;
            color: #666;
        }
        
        .message-alias {
            font-weight: bold;
            color: var(--primary-color);
        }
        
        .message-time {
            color: #888;
        }
        
        .message-content {
            word-wrap: break-word;
        }
        
        .no-messages {
            padding: 20px;
            text-align: center;
            color: #888;
        }
        
        .toggle-theme {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            position: absolute;
            top: 20px;
            right: 20px;
        }
        
        .dark-theme {
            --bg-color: #1a1a1a;
            --card-bg: #2c2c2c;
            --text-color: #f0f0f0;
        }
        
        @media (max-width: 600px) {
            .container {
                width: 100%;
                padding: 10px;
            }
            
            header {
                padding: 15px;
            }
            
            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <button class="toggle-theme" id="themeToggle">Toggle Dark Mode</button>
    
    <div class="container">
        <header>
            <h1>Anonymous Message Board</h1>
        </header>
        
        <div class="message-form">
            <form id="postForm">
                <div>
                    <input type="text" id="aliasInput" placeholder="Anonymous Alias (optional)">
                </div>
                <div>
                    <textarea id="messageInput" placeholder="Type your message here..."></textarea>
                </div>
                <button type="submit">Post Message</button>
            </form>
        </div>
        
        <div class="message-board" id="messageBoard">
            <div class="no-messages" id="noMessages">No messages yet. Be the first to post!</div>
            <!-- Messages will be added here dynamically -->
        </div>
    </div>
    
    <script>
        // Initialize message storage
        let messages = JSON.parse(localStorage.getItem('anonMessages')) || [];
        
        // DOM elements
        const messageBoard = document.getElementById('messageBoard');
        const noMessages = document.getElementById('noMessages');
        const postForm = document.getElementById('postForm');
        const aliasInput = document.getElementById('aliasInput');
        const messageInput = document.getElementById('messageInput');
        const themeToggle = document.getElementById('themeToggle');
        
        // Check for saved theme preference
        if (localStorage.getItem('darkTheme') === 'true') {
            document.body.classList.add('dark-theme');
        }
        
        // Toggle dark/light theme
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            localStorage.setItem('darkTheme', document.body.classList.contains('dark-theme'));
        });
        
        // Handle form submission
        postForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const messageText = messageInput.value.trim();
            if (!messageText) return;
            
            const alias = aliasInput.value.trim() || 'Anonymous';
            
            // Create new message object
            const newMessage = {
                id: Date.now(),
                alias: alias,
                content: messageText,
                timestamp: new Date().toISOString()
            };
            
            // Add to message list
            messages.unshift(newMessage);
            
            // Save to local storage
            localStorage.setItem('anonMessages', JSON.stringify(messages));
            
            // Reset form
            messageInput.value = '';
            
            // Refresh the display
            displayMessages();
        });
        
        // Format date for display
        function formatDate(dateString) {
            const date = new Date(dateString);
            
            // Options for date formatting
            const options = { 
                month: 'short', 
                day: 'numeric',
                hour: '2-digit', 
                minute: '2-digit'
            };
            
            return date.toLocaleDateString('en-US', options);
        }
        
        // Display all messages
        function displayMessages() {
            if (messages.length === 0) {
                noMessages.style.display = 'block';
                return;
            }
            
            noMessages.style.display = 'none';
            
            // Clear current messages
            while (messageBoard.children.length > 1) {
                messageBoard.removeChild(messageBoard.lastChild);
            }
            
            // Add each message to the board
            messages.forEach(message => {
                const messageElement = document.createElement('div');
                messageElement.className = 'message';
                
                const formattedDate = formatDate(message.timestamp);
                
                messageElement.innerHTML = `
                    <div class="message-header">
                        <span class="message-alias">${escapeHTML(message.alias)}</span>
                        <span class="message-time">${formattedDate}</span>
                    </div>
                    <div class="message-content">${escapeHTML(message.content)}</div>
                `;
                
                messageBoard.appendChild(messageElement);
            });
        }
        
        // Escape HTML to prevent XSS
        function escapeHTML(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
        
        // Initialize the message board
        displayMessages();
    </script>
</body>
</html>
